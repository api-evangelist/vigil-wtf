apis:
- aid: vigil-wtf:vigil-proxy
  name: Vigil Proxy
  tags:
  - AI Middleware
  - Monitoring
  humanURL: https://www.vigil.wtf/docs
  baseURL: https://api.vigil.wtf
  properties:
  - url: https://www.vigil.wtf/docs
    type: Documentation
  - url: https://www.vigil.wtf/openapi.json
    type: OpenAPI
  - url: https://www.vigil.wtf/docs#errors
    type: ErrorCatalog
  description: >-
    A pass-through proxy for AI provider APIs. Requests to
    https://api.vigil.wtf/{user_id}/{provider}/{path} are forwarded to the named provider and the
    provider's response is returned, with Vigil's request id and optimisation headers added. The
    OpenAPI description covers Vigil's own surface only: the route, its path parameters and
    headers, and Vigil's error format. Request and response bodies are the provider's own.

