apis:
- aid: vigil-wtf:vigil-wtf-vigil-proxy-api
  name: Vigil Proxy
  description: A pass-through proxy for AI provider APIs. Requests to https://api.vigil.wtf/{user_id}/{provider}/{path}
    are forwarded to the named provider and the provider's response is returned, with Vigil's request id and optimisation
    headers added. The provider's OpenAPI covers Vigil's own surface only (the route, its path parameters and headers,
    and Vigil's error format); request and response bodies are the upstream provider's own.
  humanURL: https://www.vigil.wtf/docs
  baseURL: https://api.vigil.wtf
  tags:
  - AI Middleware
  - Monitoring
  properties:
  - type: OpenAPI
    url: openapi/vigil-wtf-vigil-proxy-api-openapi.yml
  - type: OpenAPI
    name: OpenAPI (provider-hosted)
    url: https://www.vigil.wtf/openapi.json
  - type: Documentation
    url: https://www.vigil.wtf/docs
  - type: ErrorCatalog
    url: https://www.vigil.wtf/docs#errors
- aid: vigil-wtf:vigil-wtf-feedback-api
  name: Vigil Feedback API
  description: Send a score from 1 to 5 for one of your proxied calls, keyed by Vigil's request id (POST /v1/feedback);
    a later score for the same request replaces the earlier one.
  humanURL: https://www.vigil.wtf/docs#feedback
  baseURL: https://api.vigil.wtf
  tags:
  - Feedback
  properties:
  - type: OpenAPI
    url: openapi/vigil-wtf-feedback-api-openapi.yml
  - type: OpenAPI
    name: OpenAPI (provider-hosted)
    url: https://www.vigil.wtf/openapi.json
  - type: Documentation
    url: https://www.vigil.wtf/docs#feedback

